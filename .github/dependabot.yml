version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Optional: Automatically merge Dependabot PRs for minor/patch updates
    # (Requires GitHub branch protection rules to be fully effective)
    # commit-message:
    #   prefix: "chore"
    #   include: "scope"
  
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"